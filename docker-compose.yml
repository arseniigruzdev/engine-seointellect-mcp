services:
  seointellect-mcp:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MCP_TRANSPORT: http
      HOST: 0.0.0.0
      PORT: 3000
      MCP_HTTP_AUTH_MODE: byok
      MCP_ALLOWED_HOSTS: localhost,127.0.0.1
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
